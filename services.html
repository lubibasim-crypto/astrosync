<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services — AstroSync</title>
<meta name="description" content="Full-stack digital marketing under one roof: social media management, paid ads, content creation, local SEO, email & SMS, and brand strategy.">
<link rel="icon" href="assets/mark.svg">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('astrosync-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<link rel="stylesheet" href="assets/site.css">
<noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body data-page="services">

<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="page-header">
  <div class="container">
    <span class="eyebrow reveal" data-bind="services.eyebrow"></span>
    <h1 class="reveal d1" data-rich="services.title"></h1>
    <p class="reveal d2" data-bind="services.sub"></p>
  </div>
</header>

<section class="section" style="padding-top:60px">
  <div class="container">
    <div class="grid g-3" data-list="services" data-variant="full"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" data-bind="process.eyebrow"></span>
      <h2 class="section-title" data-rich="process.title"></h2>
      <p class="section-sub" data-bind="process.sub"></p>
    </div>
    <div class="steps" data-list="process"></div>
  </div>
</section>

<section class="section cta-band" style="padding-top:0">
  <div class="container">
    <div class="cta-inner reveal">
      <h2>Not Sure Which Service<br>You Need?</h2>
      <p>Book a free 30-minute audit and we'll map out exactly what would move the needle for your business.</p>
      <a class="btn btn-white btn-lg" href="contact.html">Book My Free Audit <span class="arr">→</span></a>
    </div>
  </div>
</section>

<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
