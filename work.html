<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Work — AstroSync</title>
<meta name="description" content="Real outcomes from real Houston businesses — case studies and client stories with growth you can take to the bank.">
<link rel="icon" href="assets/mark.svg">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('astrosync-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<link rel="stylesheet" href="assets/site.css">
<noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body data-page="work">

<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="page-header">
  <div class="container">
    <span class="eyebrow reveal" data-bind="results.eyebrow"></span>
    <h1 class="reveal d1" data-rich="results.title"></h1>
    <p class="reveal d2" data-bind="results.sub"></p>
  </div>
</header>

<section class="section" style="padding-top:60px">
  <div class="container">
    <div class="grid g-2" data-list="results"></div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" data-bind="testimonials.eyebrow"></span>
      <h2 class="section-title" data-rich="testimonials.title"></h2>
    </div>
    <div class="grid g-3" data-list="testimonials"></div>
  </div>
</section>

<section class="section cta-band" style="padding-top:0">
  <div class="container">
    <div class="cta-inner reveal">
      <h2>Your Business Could Be<br>The Next Case Study.</h2>
      <p>Book a free audit and we'll show you exactly where the growth is hiding in your market.</p>
      <a class="btn btn-white btn-lg" href="contact.html">Start Growing Today <span class="arr">→</span></a>
    </div>
  </div>
</section>

<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
