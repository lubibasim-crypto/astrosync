<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroSync — Houston Social Media Marketing Agency</title>
<meta name="description" content="AstroSync blends Houston strategy with a world-class execution team — full-service social media marketing at prices local businesses can actually afford.">
<link rel="icon" href="assets/mark.svg">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('astrosync-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<link rel="stylesheet" href="assets/site.css">
<noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body data-page="home">

<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<!-- HERO -->
<header class="hero">
  <div class="container">
    <div class="hero-grid">
      <div>
        <div class="badge reveal"><span class="dot"></span><span data-bind="hero.badge">Houston's Premier Affordable Agency</span></div>
        <h1 class="reveal d1" data-rich="hero.title">Grow Faster.</h1>
        <p class="lead reveal d2" data-bind="hero.lead"></p>
        <div class="hero-ctas reveal d3">
          <a class="btn btn-primary btn-lg" data-attr="href:hero.ctaPrimary.href"><span data-bind="hero.ctaPrimary.label">Get Your Free Audit</span> <span class="arr">→</span></a>
          <a class="btn btn-outline btn-lg" data-attr="href:hero.ctaSecondary.href"><span data-bind="hero.ctaSecondary.label">Explore Services</span></a>
        </div>
        <div class="hero-stats" data-list="herostats"></div>
      </div>
      <div class="sphere-stage reveal d2" id="sphere" aria-hidden="true"></div>
    </div>
  </div>
</header>

<!-- TICKER -->
<div class="ticker" data-list="ticker" aria-hidden="true"></div>

<!-- WHY -->
<section class="section">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" data-bind="why.eyebrow"></span>
      <h2 class="section-title" data-rich="why.title"></h2>
      <p class="section-sub" data-bind="why.sub"></p>
    </div>
    <div class="grid g-4" data-list="why"></div>
  </div>
</section>

<!-- SERVICES TEASER -->
<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" data-bind="services.eyebrow"></span>
      <h2 class="section-title" data-rich="services.title"></h2>
    </div>
    <div class="grid g-3" data-list="services" data-limit="3" data-variant="teaser"></div>
    <div style="text-align:center;margin-top:2.4rem" class="reveal">
      <a class="btn btn-outline" href="services.html">View All Services <span class="arr">→</span></a>
    </div>
  </div>
</section>

<!-- RESULTS -->
<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head center reveal">
      <span class="eyebrow" data-bind="results.eyebrow"></span>
      <h2 class="section-title" data-rich="results.title"></h2>
    </div>
    <div class="grid g-4" data-list="results"></div>
    <div style="text-align:center;margin-top:2.4rem" class="reveal">
      <a class="btn btn-outline" href="work.html">See Our Work <span class="arr">→</span></a>
    </div>
  </div>
</section>

<!-- TESTIMONIALS -->
<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" data-bind="testimonials.eyebrow"></span>
      <h2 class="section-title" data-rich="testimonials.title"></h2>
    </div>
    <div class="grid g-3" data-list="testimonials" data-limit="3"></div>
  </div>
</section>

<!-- CTA -->
<section class="section cta-band" style="padding-top:0">
  <div class="container">
    <div class="cta-inner reveal">
      <h2 data-rich="cta.title"></h2>
      <p data-bind="cta.text"></p>
      <a class="btn btn-white btn-lg" data-attr="href:cta.href"><span data-bind="cta.button">Start Growing Today</span> <span class="arr">→</span></a>
    </div>
  </div>
</section>

<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
