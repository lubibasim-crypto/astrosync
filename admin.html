<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AstroSync — Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/mark.svg">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="login-card">
    <h1><img class="mark" src="assets/mark.svg" alt=""> AstroSync Admin</h1>
    <p>Sign in to edit your website content.</p>
    <form id="loginForm">
      <label for="pw">Password</label>
      <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••">
      <button type="submit">Sign In</button>
      <div class="login-err" id="loginErr"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand"><img class="mark" src="assets/mark.svg" alt=""> Admin</div>
    <div class="tagline">Content control panel</div>
    <nav id="navList"></nav>
    <div class="side-foot">
      <a href="index.html" target="_blank" rel="noopener">↗ View live site</a>
      <button id="logoutBtn" type="button">⎋ Log out</button>
      <span style="font-size:.7rem;color:var(--a-muted);padding:.3rem .4rem" id="connBadge">●</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h2 id="panelTitle">Brand</h2>
      <span class="save-status" id="saveStatus"></span>
      <button class="btn btn-ghost" id="importBtn" type="button">Import</button>
      <button class="btn btn-ghost" id="exportBtn" type="button">Export</button>
      <button class="btn btn-ghost" id="resetBtn" type="button">Reset</button>
      <button class="btn btn-primary" id="saveBtn" type="button">Save changes</button>
      <input type="file" id="importFile" accept="application/json" class="hidden">
    </div>
    <div class="content" id="panels"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="assets/content.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
