<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — AstroSync</title>
<meta name="description" content="AstroSync is Houston's under-dog agency: US-based strategy plus a Pakistan execution team, delivering agency-level firepower at honest prices.">
<link rel="icon" href="assets/mark.svg">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('astrosync-theme')||'dark')}catch(e){document.documentElement.setAttribute('data-theme','dark')}</script>
<link rel="stylesheet" href="assets/site.css">
<noscript><style>body{opacity:1!important}</style></noscript>
</head>
<body data-page="about">

<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="page-header">
  <div class="container">
    <span class="eyebrow reveal" data-bind="about.eyebrow"></span>
    <h1 class="reveal d1" data-rich="about.title"></h1>
    <p class="reveal d2" data-bind="about.lead"></p>
  </div>
</header>

<!-- WHY GRID -->
<section class="section" style="padding-top:60px">
  <div class="container">
    <div class="grid g-4" data-list="why"></div>
  </div>
</section>

<!-- DUAL TEAM -->
<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" data-bind="about.teamEyebrow"></span>
      <h2 class="section-title" data-rich="about.teamTitle"></h2>
      <p class="section-sub" data-bind="about.teamSub"></p>
    </div>
    <div class="split" data-list="teams"></div>
  </div>
</section>

<!-- VALUES -->
<section class="section" style="padding-top:0">
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow" data-bind="about.valuesEyebrow"></span>
      <h2 class="section-title" data-rich="about.valuesTitle"></h2>
    </div>
    <div style="max-width:840px" data-list="values"></div>
  </div>
</section>

<section class="section cta-band" style="padding-top:0">
  <div class="container">
    <div class="cta-inner reveal">
      <h2>Let's Build Something<br>Worth Talking About.</h2>
      <p>Meet the team behind the work. Book a free audit and see exactly how the dual-team model would work for you.</p>
      <a class="btn btn-white btn-lg" href="contact.html">Get In Touch <span class="arr">→</span></a>
    </div>
  </div>
</section>

<script src="assets/content.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
